
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} | Confiro Já</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f4f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 750px;
            margin: auto;
        }
        header {
            background: #17365d;
            color: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .painel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .campo {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }
        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        .botao {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            background: #17365d;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }
        .secundario {
            background: #edf2f8;
            color: #17365d;
            margin-left: 7px;
        }
        .erro {
            color: #a52a2a;
            font-size: 13px;
            margin-top: 5px;
        }
        footer {
            text-align: center;
            color: #777;
            padding: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="container">

    <header>
        <h1>Confiro Já</h1>
        <p>{{ titulo }}</p>
    </header>

    <div class="painel">
        <h2>Dados da categoria</h2>

        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="campo">
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}
                        <div class="erro">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            {% if form.non_field_errors %}
                <div class="erro">{{ form.non_field_errors }}</div>
            {% endif %}

            <button type="submit" class="botao">Salvar categoria</button>

            <a href="{% url 'estoque:gerenciar_categorias' %}"
               class="botao secundario">
                Cancelar
            </a>
        </form>
    </div>

    <footer>
        Confiro Já — Sistema de Controle de Estoque Escolar
    </footer>

</div>
</body>
</html>
