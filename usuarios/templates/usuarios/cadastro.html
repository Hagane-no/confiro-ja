
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Confiro Já</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f4f8;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 480px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #17365d;
        }

        p {
            color: #555;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #24558b;
        }

        .erro {
            color: #b00020;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Confiro Já</h1>

    <p>Cadastro de funcionário</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for campo in form %}
            <label for="{{ campo.id_for_label }}">
                {{ campo.label }}
            </label>

            {{ campo }}

            {% for erro in campo.errors %}
                <div class="erro">{{ erro }}</div>
            {% endfor %}
        {% endfor %}

        <button type="submit">Realizar cadastro</button>
    </form>

</div>

</body>
</html>
